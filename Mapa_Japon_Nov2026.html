<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#222}
header{background:#8B0000;color:white;padding:14px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:19px;font-weight:600}
header span{font-size:12px;opacity:.8}
.toolbar{background:white;border-bottom:1px solid #e0e0e0;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.city-btn{padding:5px 14px;border-radius:8px;border:1px solid #ccc;background:white;font-size:13px;cursor:pointer;font-weight:500;transition:all .15s}
.city-btn.active{background:#8B0000;color:white;border-color:#8B0000}
.city-btn:hover:not(.active){background:#f0f0f0}
.toggle-btn{padding:5px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;transition:all .15s;border:1.5px solid}
.toggle-btn.stores{border-color:#1a1a2e;color:#1a1a2e;background:white}
.toggle-btn.stores.active{background:#1a1a2e;color:white}
.toggle-btn.metro{border-color:#0277BD;color:#0277BD;background:white}
.toggle-btn.metro.active{background:#0277BD;color:white}
.sep{width:1px;height:24px;background:#e0e0e0;flex-shrink:0}
.day-filters{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.day-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;user-select:none;font-weight:500}
.day-chip.off{opacity:.3}
.toggle-all{font-size:11px;padding:3px 9px;border:1px solid #ccc;border-radius:20px;background:white;cursor:pointer;color:#555}
.toggle-all:hover{background:#f0f0f0}
.filter-label{font-size:12px;color:#666;white-space:nowrap}
#map{height:calc(100vh - 160px);width:100%}
.leaflet-tile-pane{filter:grayscale(88%) brightness(1.1) contrast(.9)}
</style>
</head>

let map, dayMarkers=[], storeMarkers=[], metroMarkers=[], activeCity='tokyo';
let hiddenDays=new Set(), storesOn=false, metroOn=false, allOff=false;

const dInfo=id=>DAYS.find(d=>d.id===id);

const circleIcon=(color,hidden)=>L.divIcon({className:'',
  html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 1px 5px rgba(0,0,0,.4);opacity:${hidden?.2:1}"></div>`,
  iconSize:[14,14],iconAnchor:[7,7]});

const diamondIcon=(vis)=>L.divIcon({className:'',
  html:`<div style="width:12px;height:12px;background:#1a1a2e;border:2px solid white;transform:rotate(45deg);box-shadow:0 1px 4px rgba(0,0,0,.5);opacity:${vis?1:0};pointer-events:${vis?'auto':'none'}"></div>`,
  iconSize:[12,12],iconAnchor:[6,6]});

const metroIcon=(vis)=>L.divIcon({className:'',
  html:`<div style="width:22px;height:22px;border-radius:4px;background:#0277BD;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;opacity:${vis?1:0};pointer-events:${vis?'auto':'none'}">M</div>`,
  iconSize:[22,22],iconAnchor:[11,11]});

function refreshDayMarkers(){
  dayMarkers.forEach(({marker,place})=>{
    const h=hiddenDays.has(place.day);
    marker.setIcon(circleIcon(dInfo(place.day).color,h));
    if(h)marker.closePopup();
  });
  document.querySelectorAll('.day-chip').forEach(c=>c.classList.toggle('off',hiddenDays.has(+c.dataset.day)));
}
function toggleDay(id){hiddenDays.has(id)?hiddenDays.delete(id):hiddenDays.add(id);refreshDayMarkers();}
function toggleAll(){
  allOff=!allOff;
  [...new Set(PLACES.filter(p=>p.city===activeCity).map(p=>p.day))].forEach(id=>allOff?hiddenDays.add(id):hiddenDays.delete(id));
  refreshDayMarkers();
}
function toggleLayer(type){
  if(type==='stores'){
    storesOn=!storesOn;
    document.getElementById('btn-stores').classList.toggle('active',storesOn);
    storeMarkers.forEach(({marker})=>marker.setIcon(diamondIcon(storesOn)));
  } else {
    metroOn=!metroOn;
    document.getElementById('btn-metro').classList.toggle('active',metroOn);
    metroMarkers.forEach(({marker})=>marker.setIcon(metroIcon(metroOn)));
  }
}
function buildFilters(city){
  const ids=[...new Set(PLACES.filter(p=>p.city===city).map(p=>p.day))].sort((a,b)=>a-b);
  document.getElementById('day-filters').innerHTML=ids.map(id=>{
    const d=dInfo(id);
    return `<span class="day-chip" data-day="${id}" onclick="toggleDay(${id})" style="background:${d.color}18;border-color:${d.color};color:${d.color}"><span style="width:8px;height:8px;border-radius:50%;background:${d.color};display:inline-block"></span>${d.label}</span>`;
  }).join('');
}
function popup(title,sub,badge,badgeColor,extra=''){
  return `<div style="min-width:200px;font-family:-apple-system,sans-serif">
    <div style="font-size:13px;font-weight:600;color:#111;margin-bottom:3px">${title}</div>
    ${sub?`<div style="font-size:11px;color:#555;margin-bottom:6px;line-height:1.5">${sub}</div>`:''}
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <span style="font-size:10px;background:${badgeColor};color:white;border-radius:10px;padding:2px 8px;font-weight:500">${badge}</span>
      ${extra?`<span style="font-size:10px;background:#f0f0f0;color:#444;border-radius:10px;padding:2px 8px">${extra}</span>`:''}
    </div></div>`;
}

function setCity(city){
  activeCity=city; hiddenDays.clear(); allOff=false;
  ['tokyo','kyoto','osaka'].forEach(c=>document.getElementById('btn-'+c).classList.toggle('active',c===city));
  map.setView(CITIES[city].center,CITIES[city].zoom);
  [...dayMarkers,...storeMarkers,...metroMarkers].forEach(({marker})=>map.removeLayer(marker));
  dayMarkers=[]; storeMarkers=[]; metroMarkers=[];

  PLACES.filter(p=>p.city===city).forEach(place=>{
    const d=dInfo(place.day);
    const m=L.marker([place.lat,place.lng],{icon:circleIcon(d.color,false),zIndexOffset:20})
      .bindPopup(popup(place.name,place.note,d.label,d.color,place.zone))
      .addTo(map);
    dayMarkers.push({marker:m,place});
  });

  STORES.filter(s=>s.city===city).forEach(store=>{
    const m=L.marker([store.lat,store.lng],{icon:diamondIcon(storesOn),zIndexOffset:10})
      .bindPopup(popup('🛍️ '+store.name,store.note,store.zone,'#1a1a2e'))
      .addTo(map);
    storeMarkers.push({marker:m,store});
  });

  METRO.filter(s=>s.city===city).forEach(st=>{
    const m=L.marker([st.lat,st.lng],{icon:metroIcon(metroOn),zIndexOffset:5})
      .bindPopup(popup('🚇 '+st.name,st.note,st.lines,'#0277BD'))
      .addTo(map);
    metroMarkers.push({marker:m,station:st});
  });

  buildFilters(city);
}

window.addEventListener('load',()=>{
  map=L.map('map').setView(CITIES.tokyo.center,13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors', maxZoom:19
    }).addTo(map);
  setCity('tokyo');
});
</script>
